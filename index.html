<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL to QR Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative overflow-hidden transition-colors duration-500 font-sans">
    <!-- Logo -->
    <img src="logo.png" alt="Logo" class="absolute top-6 left-6 h-12 z-50">

    <!-- Main Container -->
    <div id="main-container" class="relative z-10 w-full max-w-md flex flex-col items-center transition-all duration-700 ease-in-out transform translate-y-0">
        <!-- URL Input Area -->
        <div id="input-area" class="w-full px-6 flex flex-col items-center bg-white bg-opacity-40 backdrop-filter backdrop-blur-lg p-8 rounded-2xl shadow-xl transition-all duration-700">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">URL을 입력하세요</h1>
            <input type="text" id="url-input" placeholder="https://example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 mb-4 text-gray-700 shadow-sm transition">
            <button id="generate-btn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:scale-105 active:scale-95">확인</button>
        </div>
    </div>

    <!-- QR Code Display Area (Initially hidden) -->
    <div id="qr-area" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-0 pointer-events-none transition-opacity duration-700 ease-in-out z-20 mt-[-2rem]">
        <div class="bg-white p-4 rounded-xl shadow-2xl hover:scale-105 transition-transform duration-300 cursor-pointer" id="qr-wrapper" title="클릭하여 다운로드">
            <div id="qrcode"></div>
        </div>
        <p class="mt-4 text-gray-800 font-medium bg-white bg-opacity-50 px-4 py-1 rounded-full text-sm animate-pulse">클릭하여 다운로드 (JPG)</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
